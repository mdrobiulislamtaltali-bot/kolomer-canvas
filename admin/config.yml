backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "stories"
    label: "ইসলামিক গল্প"
    folder: "stories"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "গল্পের শিরোনাম"
        name: "title"
        widget: "string"

      - label: "প্রকাশের তারিখ"
        name: "date"
        widget: "datetime"

      - label: "প্রচ্ছদ ছবি"
        name: "image"
        widget: "image"
        required: false

      - label: "গল্পের লেখা"
        name: "body"
        widget: "markdown"
